name: Publicar no GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '30 2,11,14,17,20 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Atualizar cotacoes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $zone = [System.TimeZoneInfo]::FindSystemTimeZoneById('America/Sao_Paulo')
          $today = [System.TimeZoneInfo]::ConvertTimeFromUtc([datetime]::UtcNow, $zone).Date
          ./download-history.ps1 -Incremental -EndDate $today
      - name: Salvar novos dados no repositorio
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coffee_prices.csv data/coffee_prices_wide.csv data/coverage.csv data/summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar cotacoes diarias do cafe"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp -r assets _site/
          cp data/coffee_prices.csv data/summary.json _site/data/
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4